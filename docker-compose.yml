# Operium Insights: flow events in, Metabase dashboards out.
#
#   Flow (API node) --POST /api/flowflex/events--> api --> mongo <-- metabase (read-only)
#
# Production (test.operium.pro):  docker compose --profile proxy up -d
# Local:                          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d

name: operium-insights

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: insights
      # Read by mongo-init/init.js on first start only.
      MONGO_API_PASSWORD: ${MONGO_API_PASSWORD:?set MONGO_API_PASSWORD in .env}
      MONGO_METABASE_PASSWORD: ${MONGO_METABASE_PASSWORD:?set MONGO_METABASE_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URL: mongodb://api:${MONGO_API_PASSWORD}@mongo:27017/insights?authSource=insights
      API_KEY: ${API_KEY:?set API_KEY in .env}
    depends_on:
      mongo:
        condition: service_healthy

  metabase-db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${MB_DB_PASSWORD:?set MB_DB_PASSWORD in .env}
    volumes:
      - metabase-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.64.6
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASSWORD}
      MB_SITE_URL: ${MB_SITE_URL:-http://localhost:3030}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_OPTS: -Xmx1g
    depends_on:
      metabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  # One-shot: creates the Metabase admin, connects Mongo (read-only user) and
  # builds the "Flow events" dashboard. Safe to re-run; it skips what exists.
  metabase-setup:
    build: ./setup
    restart: "no"
    environment:
      METABASE_URL: http://metabase:3000
      MB_ADMIN_EMAIL: ${MB_ADMIN_EMAIL:?set MB_ADMIN_EMAIL in .env}
      MB_ADMIN_PASSWORD: ${MB_ADMIN_PASSWORD:?set MB_ADMIN_PASSWORD in .env}
      MB_SITE_NAME: ${MB_SITE_NAME:-Operium Insights}
      MONGO_METABASE_PASSWORD: ${MONGO_METABASE_PASSWORD}
      PUBLIC_DASHBOARD: ${PUBLIC_DASHBOARD:-true}
    depends_on:
      metabase:
        condition: service_healthy

  # HTTPS for the domain. Only started with --profile proxy (production).
  caddy:
    image: caddy:2.8-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-test.operium.pro}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - metabase

volumes:
  mongo-data:
  metabase-db:
  caddy-data:
  caddy-config:
